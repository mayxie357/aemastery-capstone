version: 2

models:
  - name: int_marketing_roas
    columns:
      - name: unique_id
        tests:
          - unique
          - not_null
  - name: int_order_items_enriched
    columns:
      - name: unique_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_sku
        tests:
          - relationships:
              arguments:
                to: ref('stg_order_items')
                field: product_sku